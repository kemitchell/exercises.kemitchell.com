name: bench press
type: dynamic
tags:
  - barbell
  - big-five
  - powerlifting
cues:
  - use safeties
  - do not use collars, so you can dump the weight off side to side
  - feet flat on floor
  - lower back slightly arched
  - racked back over the forehead
  - retract and depress shoulder blades
  - bar travels a curved path down to the solar plexus
  - hold breath and brace core before lowering
  - hold breath through the descent and ascent
  - may do more than one rep on one breath
  - hands slightly pronated, so bar supported under the bones of the forearm
  - squeeze with pinky fingers
  - grip wide to focus pecs, narrow to focus triceps
  - grip of maximum range of motion puts forearms vertical at the bottom
  - keep heels flat to the floor
  - press legs as if trying to slide body up the bench
  - finish under control, without popping shoulders off the bench
muscles:
  - pectoralis major
