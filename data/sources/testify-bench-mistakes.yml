title: Top 10 Bench Press Mistakes
source: Testify Strength
url: https://www.youtube.com/watch?v=mK4AWysDyfM
exercises:
  - bench press
notes: |
  1.  Stare at a point on the ceiling.
  2.  Grip width.  Slightly pronated.  Thumb around bar.
  3.  Stance: squat width, feet flat on ground
  4.  Drive feet diagonally into ground, as if trying to slide body up the bench.
  5.  Don't lift butt off the bench.
  6.  Shoulders back and down.
  7.  Breathing / Valsalva Maneuver
  8.  Angle bar path.
  9.  Be careful.  Most dangerous lift.  Racking and unracking.  No collars.  Spotter.  Safety bars.
  10. Inefficient unracking.  Bridge butt up off bench and lever it up.
